name: Fly Deploy
on:
  push:
    branches:
      - main

  # Enable running workflow from actions tab
  workflow_dispatch:

# Don't let two pushes to main deploy at once — but QUEUE the newer run, never
# cancel the older one. A bluegreen deploy mutates machine state in steps, and
# killing it between "new machine up" and "old machine replaced" strands the app
# on two images, which makes every later deploy fail its single-image
# precondition until a human destroys the orphan (2026-08-07).
concurrency:
  group: fly-deploy
  cancel-in-progress: false

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  # GIT_SHA bakes the commit into /health (.git is dockerignored, so the build
  # can't read it itself — same as bun run deploy).
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      app: mondiale
      sha: ${{ github.sha }}
    secrets: inherit

  deploy:
    name: Deploy app
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Deploying a built image needs only the Fly config, not ~650 MB of media.
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /fly*.toml
            /Dockerfile
            /.dockerignore
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      # Blue-green: the replacement machine boots and passes /health BEFORE
      # traffic flips, so a deploy costs live games a ~1s reconnect blip
      # (drained gracefully — see lib/events/server/graceful-shutdown.ts)
      # instead of a ~25s outage. --ha=false keeps the default machine count
      # at one; scaling out is safe now that game-routing.ts shards each room
      # to its owning machine.
      - run: flyctl deploy --image ${{ needs.build.outputs.image }} --ha=false --strategy bluegreen
