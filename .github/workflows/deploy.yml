name: Fly Deploy
on:
  push:
    branches:
      - main

  # Enable running workflow from actions tab
  workflow_dispatch:

# Don't let two pushes to main deploy at once; cancel the older run.
concurrency:
  group: fly-deploy
  cancel-in-progress: true

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      # Blue-green: the replacement machine boots and passes /health BEFORE
      # traffic flips, so a deploy costs live games a ~1s reconnect blip
      # (drained gracefully — see lib/events/server/graceful-shutdown.ts)
      # instead of a ~25s outage. --ha=false keeps the default machine count
      # at one; scaling out is safe now that game-routing.ts shards each room
      # to its owning machine.
      # GIT_SHA bakes the commit into /health (.git is dockerignored, so the
      # build can't read it itself — same as bun run deploy).
      - run: flyctl deploy --remote-only --ha=false --strategy bluegreen --build-arg GIT_SHA=${{ github.sha }}
