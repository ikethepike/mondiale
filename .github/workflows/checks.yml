# Verifies every PR and every push to main. Before this, nothing ran the test
# suite in CI — deploy.yml went straight from a push on main to flyctl, so a
# red commit could reach Fly and the 634 unit tests only ran when someone
# remembered locally.
#
# The four checks are independent, so none hides another: a formatting slip and
# a failing test should both be visible from one run, not hidden behind
# whichever fails first. The unit tests own a job because they take minutes and
# the static checks take one; `--frozen-lockfile` install + `nuxt prepare` (via
# postinstall) is what makes vue-tsc able to see .nuxt's generated types.
name: Checks
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# A force-push mid-run should cancel the stale run, not race it. Keyed per ref
# so main and each PR queue independently.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Full checkout: places.test.ts and the anthem tests read public/ media.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run test

  static:
    name: Typecheck, lint, format
    runs-on: ubuntu-latest
    steps:
      # Nothing here reads public/'s ~650 MB of media, so the clone skips its
      # blobs; the manifest is the one file in it prettier formats.
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/*
            /public/site.webmanifest

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Nuxt's generated types come from the postinstall `nuxt prepare` above.
      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        if: '!cancelled()'
        run: bun run lint

      # eslint does not cover formatting here, so this is its own gate — a
      # missing space once passed a clean lint run and reached review.
      - name: Format
        if: '!cancelled()'
        run: bun run format:check

  # Separate job: this one builds the app, so it is minutes rather than
  # seconds. Keeping it apart means the fast checks above still report
  # quickly instead of waiting behind a build.
  #
  # Guards the pawn-replay invariant (the board must only ever animate the
  # walk a pawn has left) through the mount/unmount cycle that the unit tests
  # in lib/board3d/use-pawn-movement.test.ts cannot reach. The config serves
  # the built output itself — no secrets: the /test harness passes a mock game
  # as a prop and never opens a socket, and a missing redis token only
  # disables the socket server rather than failing the boot.
  e2e:
    name: Pawn-replay e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Keyed on the lockfile: the browser build is pinned by the
      # @playwright/test version, so a dependency bump re-downloads.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lockb') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      # System deps live outside the cached browser directory.
      - name: Install Chromium system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Build
        run: bun run build

      - name: Run pawn-replay e2e
        run: bun run test:e2e:repro

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
