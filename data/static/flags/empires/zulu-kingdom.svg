<!-- Hand-drawn after the supplied Zulu Kingdom flag reference: the white Nguni shield (isihlangu) with black lacing, crossed spears and staff with plume, on red. Modern reconstruction. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <rect width="900" height="600" fill="#b10d0d"/>
  <g stroke="#141414" stroke-width="5" fill="#f4f1ea">
    <!-- crossed spears: one vertical spear (blade co-axial with shaft),
         rotated into the X around its tip -->
    <defs>
      <g id="spear">
        <rect x="-6" y="66" width="12" height="400" rx="6"/>
        <rect x="-9" y="60" width="18" height="12" rx="4"/>
        <path d="M0 0 C 15 18, 19 40, 12 64 L -12 64 C -19 40, -15 18, 0 0 Z"/>
      </g>
    </defs>
    <use href="#spear" transform="translate(322 84) rotate(-36)"/>
    <use href="#spear" transform="translate(578 84) rotate(36)"/>
    <!-- central staff -->
    <rect x="443" y="76" width="14" height="472" rx="7"/>
    <!-- plume: rounded ostrich tuft -->
    <path d="M450 26 C 430 22, 414 32, 410 48 C 404 46, 396 48, 392 56 C 398 64, 406 66, 414 62 C 410 74, 416 86, 428 90 C 432 82, 438 78, 444 78 C 442 88, 448 98, 458 100 C 466 94, 468 84, 464 76 C 474 78, 484 74, 488 64 C 482 58, 474 56, 466 58 C 470 44, 464 32, 450 26 Z"/>
  </g>
  <!-- shield: tall pointed oval -->
  <path d="M450 100 C 566 162, 566 398, 450 460 C 334 398, 334 162, 450 100 Z" fill="#f4f1ea" stroke="#141414" stroke-width="7"/>
  <!-- lacing rows, central up-arrow, lower marks -->
  <g fill="#141414">
    <rect x="398" y="150" width="40" height="13" rx="4"/><rect x="462" y="150" width="40" height="13" rx="4"/>
    <rect x="398" y="174" width="40" height="13" rx="4"/><rect x="462" y="174" width="40" height="13" rx="4"/>
    <rect x="398" y="198" width="40" height="13" rx="4"/><rect x="462" y="198" width="40" height="13" rx="4"/>
    <rect x="398" y="222" width="40" height="13" rx="4"/><rect x="462" y="222" width="40" height="13" rx="4"/>
    <rect x="398" y="294" width="40" height="13" rx="4"/><rect x="462" y="294" width="40" height="13" rx="4"/>
    <rect x="398" y="318" width="40" height="13" rx="4"/><rect x="462" y="318" width="40" height="13" rx="4"/>
    <rect x="398" y="342" width="40" height="13" rx="4"/><rect x="462" y="342" width="40" height="13" rx="4"/>
    <rect x="445" y="200" width="10" height="158" rx="5"/>
    <path d="M450 172 L 475 212 L 425 212 Z"/>
    <ellipse cx="450" cy="398" rx="23" ry="14"/>
  </g>
</svg>
