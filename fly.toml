# fly.toml — Mondiale (Nuxt + Socket.IO)
#
# Deploys are blue-green (see deploy.yml): the replacement passes /health
# before traffic flips, then this machine drains — releases its room leases,
# closes its sockets, settles in-flight writes — and exits
# (lib/events/server/graceful-shutdown.ts). Live games reconnect in ~1s.
#
# Multi-machine is supported by ROOM SHARDING, not shared state: every socket
# connection carries its gameId, and lib/events/server/game-routing.ts replays
# it (fly-replay) to the machine that owns that game. One machine owns a room's
# sockets, task queue and timers, so the single-process invariants hold at any
# machine count. Scale with `fly scale count N` when capacity needs it; the
# scaling unit is rooms, and each machine's ceiling is the connection
# hard_limit below.

app = "mondiale"
primary_region = "arn"
kill_signal = "SIGINT"
# The graceful drain needs room: settle in-flight writes (capped at 3s in
# graceful-shutdown.ts) THEN release the room leases (a Redis round-trip per
# live room). Blue-green means nothing waits on this machine, so generous
# beats truncated — a drain cut short leaves leases to expire by TTL.
kill_timeout = 15

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  # Never spin down: keeps game sessions and in-memory Socket.IO state alive.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Every player/spectator is a LONG-LIVED websocket plus transient HTTP
  # (assets, health checks, polling-upgrade handshakes). 25 proved saturable
  # by a handful of tabs (2026-07-26: proxy hit the hard limit and refused
  # upgrades — presents to players as a frozen board).
  [http_service.concurrency]
    type = "connections"
    soft_limit = 60
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
